model:
  # The quantity of steps in the diffusion process
  T: 2000
  # Quantity of samples to use when approximating the loss
  num_sample_steps: 30
  # Predict the clean data x_0 and derive each reverse step from it
  predict_x0: true
  # Weight of the cross-entropy loss on the x_0 prediction (0 disables it)
  x0_loss_weight: 1.0

training:
  # Quantity of training epochs
  epochs: 2500
  # Learning rate
  lr: 0.005
  # How frequently to checkpoint the model
  save_every_n_epochs: 250
  # How frequently to run validation (it is also run on the final epoch)
  validate_every_n_epochs: 100
  # How frequently to generate examples for the evolution gif (they are also generated on the final epoch)
  examples_every_n_epochs: 100
  # The quantity of examples to use when generating the evolution gif
  num_examples: 10
  # The total quantity of samples to use when validating the model
  num_val_samples: 1024
  # the quantity of samples to take at a time when validating the model
  val_batch_size: 1024
  # The threshold for grad_clip_norm
  clip_thresh: 1.0

data:
  # Quantity of training samples per minibatch
  batch_size: 64